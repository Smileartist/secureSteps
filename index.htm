<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Secure Steps - Walk with Confidence</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <svg style="display: none;">
        <symbol id="app-logo" viewBox="0 0 100 100">
            <defs>
                <linearGradient id="grad1" x1="0%" y1="0%" x2="100%" y2="100%">
                    <stop offset="0%" style="stop-color:#3b82f6;stop-opacity:1" />
                    <stop offset="100%" style="stop-color:#8b5cf6;stop-opacity:1" />
                </linearGradient>
            </defs>
            <path fill="url(#grad1)" d="M50,0 C22.4,0,0,22.4,0,50 C0,77.6,50,100,50,100 C50,100,100,77.6,100,50 C100,22.4,77.6,0,50,0 Z"/>
            <path fill="white" d="M45,35 C42,32, 38,35, 40,40 C42,45, 50,55, 48,65 C46,75, 40,80, 50,85 C60,80, 65,65, 60,50 C58,45, 50,40, 45,35 M35,25 A3,3 0 1,1 41,25 A3,3 0 1,1 35,25 M45,22 A3,3 0 1,1 51,22 A3,3 0 1,1 45,22 M55,25 A3,3 0 1,1 61,25 A3,3 0 1,1 55,25 M63,32 A3,3 0 1,1 69,32 A3,3 0 1,1 63,32"/>
        </symbol>
    </svg>

    <div id="login-screen" class="login-container">
        <div class="login-box">
            <svg class="logo-large"><use href="#app-logo"></use></svg>
            
            <h1>Secure Steps</h1>
            <p>Walk with Confidence.</p>
            
            <form id="login-form" onsubmit="window.handleLogin(event)">
                <input type="email" placeholder="Email" required>
                <input type="password" placeholder="Password" required>
                <button type="submit" class="btn-primary">Secure Login</button>
            </form>
            <p class="terms">Powered by Community Safety</p>
        </div>
    </div>

    <div id="app-container" class="hidden">
        
        <header class="app-header">
            <div class="logo-container">
                <svg class="logo-small"><use href="#app-logo"></use></svg>
                <span class="logo-text">Secure Steps</span>
            </div>
            <button onclick="toggleTheme()" class="theme-toggle"><i class="fas fa-moon"></i></button>
        </header>

        <main id="app-viewport">
            <section id="page-map" class="page active">
                <div id="map"></div>
                <div class="map-overlay-tools">
                    <button onclick="locateUser()" class="tool-btn"><i class="fas fa-crosshairs"></i></button>
                    <button onclick="enableAddRiskMode()" class="tool-btn warning" id="add-risk-btn"><i class="fas fa-exclamation-triangle"></i></button>
                </div>
                <div class="sos-container">
                    <button id="sos-btn" class="sos-pulse">SOS</button>
                </div>
                <div id="risk-instruction" class="instruction-banner hidden">
                    Tap map to mark danger zone
                    <button onclick="disableAddRiskMode()">Cancel</button>
                </div>
            </section>

            <section id="page-contacts" class="page">
                <div class="content-wrapper">
                    <h2>My Circle</h2>
                    <p class="subtitle">Trusted contacts for SOS alerts.</p>
                    <div class="input-group">
                        <input type="text" id="c-name" placeholder="Name">
                        <input type="tel" id="c-phone" placeholder="Phone">
                        <button onclick="addContact()" class="btn-add"><i class="fas fa-plus"></i></button>
                    </div>
                    <ul id="contact-list" class="styled-list"></ul>
                </div>
            </section>

            <section id="page-settings" class="page">
                <div class="content-wrapper">
                    <h2>Settings</h2>
                    <div class="setting-card">
                        <div class="setting-row">
                            <span>Dark Theme</span>
                            <label class="switch">
                                <input type="checkbox" id="dark-mode-toggle" onchange="toggleTheme()">
                                <span class="slider round"></span>
                            </label>
                        </div>
                    </div>
                    <button onclick="window.handleLogout()" class="btn-logout">Log Out</button>
                </div>
            </section>
        </main>

        <nav class="bottom-nav">
            <div class="nav-item active" onclick="navTo('page-map', this)">
                <i class="fas fa-map-marked-alt"></i> <span>Map</span>
            </div>
            <div class="nav-item" onclick="navTo('page-contacts', this)">
                <i class="fas fa-users"></i> <span>Contacts</span>
            </div>
            <div class="nav-item" onclick="navTo('page-settings', this)">
                <i class="fas fa-cog"></i> <span>Settings</span>
            </div>
        </nav>
    </div>

    <script type="module">
        import { signInUser, onAuthStateChange, getRiskyZones, getUserProfile, signOutUser, addRiskyZone } from './supabase-handler.js';

        // Login Logic
        window.handleLogin = async (e) => {
            e.preventDefault();
            const email = document.querySelector('input[type="email"]').value;
            const password = document.querySelector('input[type="password"]').value;
            await signInUser(email, password);
        };

        // Logout Logic
        window.handleLogout = async () => {
            await signOutUser();
            // Auth State Change listener will handle the screen switch
        };

        // Auth Listener
        onAuthStateChange(async (user) => {
            if (user) {
                console.log("Welcome to Secure Steps:", user.email);
                document.getElementById('login-screen').classList.add('hidden');
                document.getElementById('app-container').classList.remove('hidden');
                
                // Initialize Map Data
                const zones = await getRiskyZones();
                zones.forEach(z => window.renderRiskZone(z)); 
                
                // Initialize Profile
                const profile = await getUserProfile();
                if(profile?.emergency_contacts) {
                    localStorage.setItem('myContacts', JSON.stringify(profile.emergency_contacts));
                    window.renderContacts(); // Refreshes UI
                }
                
                setTimeout(window.initMap, 100);
            } else {
                document.getElementById('app-container').classList.add('hidden');
                document.getElementById('login-screen').classList.remove('hidden');
            }
        });

        // Link Backend to Frontend Risk Reporting
        window.backendReportZone = async (lat, lng) => {
            await addRiskyZone(lat, lng, "Reported via Secure Steps App");
        };
    </script>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="script.js"></script>
</body>
</html>
